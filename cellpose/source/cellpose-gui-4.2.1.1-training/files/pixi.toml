[workspace]
channels = ["conda-forge"]
name = "cellpose-gui-4.2.1.1-training"
platforms = [{ platform = "linux-64", cuda = "12" }]
version = "0.1.0"

[environments]
cellpose-gui-training = ["cellpose-gui-training"]

[feature.cellpose-gui-training.dependencies]
python = "3.13.*"
jupyterlab = "==4.6.1"
matplotlib = ">=3.11.2,<4"
ipykernel = ">=7.3.0,<8"
pandas = ">=3.0.6,<4"
zenodo_get = ">=3.1.0,<4"

[feature.cellpose-gui-training.pypi-dependencies]
cellpose = { version = "==4.2.1.1", extras = ["gui"] }
dinov3 = { git = "https://github.com/facebookresearch/dinov3.git" }
